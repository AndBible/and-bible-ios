release_notes: |-
  Questo aggiornamento include correzioni di bug:
  - I vecchi backup dei segnalibri ora vengono ripristinati correttamente.
  - Corrette le posizioni di lettura salvate che potevano aprire il libro o il capitolo sbagliato.
  - La navigazione tra capitoli e libri è più affidabile.
  - Corretti rari arresti anomali durante la lettura di libri e documenti EPUB.
