release_notes: |-
  Această actualizare conține remedieri de erori:
  - Copiile de rezervă mai vechi ale marcajelor sunt acum restaurate corect.
  - Au fost remediate pozițiile de citire salvate care puteau deschide cartea sau capitolul greșit.
  - Navigarea între capitole și cărți este mai fiabilă.
  - Au fost remediate blocări rare la citirea cărților și a documentelor EPUB.
