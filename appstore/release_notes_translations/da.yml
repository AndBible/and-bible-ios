release_notes: |-
  Denne opdatering indeholder fejlrettelser:
  - Ældre sikkerhedskopier af bogmærker gendannes nu korrekt.
  - Rettet gemte læsepositioner, der kunne åbne den forkerte bog eller det forkerte kapitel.
  - Navigation mellem kapitler og bøger er mere pålidelig.
  - Rettet sjældne nedbrud under læsning af bøger og EPUB-dokumenter.
