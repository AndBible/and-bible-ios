release_notes: |-
  يتضمن هذا التحديث إصلاحات للأخطاء:
  - تتم الآن استعادة النسخ الاحتياطية القديمة للإشارات المرجعية بشكل صحيح.
  - تم إصلاح مواضع القراءة المحفوظة التي كانت قد تفتح السفر أو الأصحاح الخطأ.
  - أصبح التنقل بين الأصحاحات والأسفار أكثر موثوقية.
  - تم إصلاح أعطال نادرة أثناء قراءة الكتب ومستندات EPUB.
