release_notes: |-
  इस अपडेट में बग फ़िक्स शामिल हैं:
  - पुराने बुकमार्क बैकअप अब सही तरीके से रीस्टोर होते हैं।
  - सहेजी गई पठन स्थितियाँ ठीक की गईं, जो गलत पुस्तक या अध्याय खोल सकती थीं।
  - अध्यायों और पुस्तकों के बीच नेविगेशन अधिक भरोसेमंद है।
  - पुस्तकें और EPUB दस्तावेज़ पढ़ते समय होने वाले दुर्लभ क्रैश ठीक किए गए।
