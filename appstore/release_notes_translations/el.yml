release_notes: |-
  Αυτή η ενημέρωση περιέχει διορθώσεις σφαλμάτων:
  - Τα κεφάλαια που διαβάζετε καταγράφονται πλέον αξιόπιστα στην πρόοδο ανάγνωσής σας.
  - Οι επιλογές του μενού σελιδοδεικτών και προόδου παραμένουν πλέον ορατές.
  - Η επιλογή «Βαθμολογία και κριτική» ανοίγει πλέον τη σελίδα της εφαρμογής στο App Store.
