release_notes: |-
  Αυτή η ενημέρωση περιλαμβάνει διορθώσεις σφαλμάτων:
  - Τα παλαιότερα αντίγραφα ασφαλείας σελιδοδεικτών πλέον επαναφέρονται σωστά.
  - Διορθώθηκαν αποθηκευμένες θέσεις ανάγνωσης που μπορούσαν να ανοίξουν λάθος βιβλίο ή κεφάλαιο.
  - Η περιήγηση μεταξύ κεφαλαίων και βιβλίων είναι πιο αξιόπιστη.
  - Διορθώθηκαν σπάνια κρασαρίσματα κατά την ανάγνωση βιβλίων και εγγράφων EPUB.
