release_notes: |-
  การอัปเดตนี้มีการแก้ไขข้อบกพร่อง:
  - บทที่คุณอ่านจะถูกบันทึกลงในความคืบหน้าการอ่านอย่างเชื่อถือได้แล้ว
  - ตัวเลือกในเมนูที่คั่นหน้าและความคืบหน้าจะแสดงอยู่เสมอแล้ว
  - ให้คะแนนและรีวิวจะเปิดหน้าแอปบน App Store แล้ว
