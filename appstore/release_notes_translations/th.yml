release_notes: |-
  การอัปเดตนี้มีการแก้ไขข้อบกพร่อง:
  - ตอนนี้การสำรองบุ๊กมาร์กเก่า กู้คืนได้อย่างถูกต้อง
  - แก้ไขตำแหน่งการอ่านที่บันทึกไว้ซึ่งอาจเปิดหนังสือหรือบทที่ไม่ถูกต้อง
  - การไปมาระหว่างบทและหนังสือเชื่อถือได้มากขึ้น
  - แก้ไขการแครชที่เกิดขึ้นได้ยากขณะอ่านหนังสือและเอกสาร EPUB
