release_notes: |-
  Deze update bevat bugfixes:
  - Oudere back-ups van bladwijzers worden nu correct hersteld.
  - Opgeslagen leesposities opgelost die het verkeerde boek of hoofdstuk konden openen.
  - Navigeren tussen hoofdstukken en boeken is betrouwbaarder.
  - Zeldzame crashes opgelost bij het lezen van boeken en EPUB-documenten.
