subtitle: "Офлайн-інструменти для Біблії"

keywords: "вивчення,коментарі,стронг,грецька,єврейська,sword,примітки,виділення,завчання,плани читання,теологія"

promotional_text: >
  Без реклами, з відкритим кодом. Розділені подання, коментарі, нумерація
  Стронга, потужний пошук, закладки й примітки - усе офлайн після
  встановлення документів.

feature_08: >
  Синхронізація між пристроями через iCloud або NextCloud/WebDAV: робочі
  області, закладки, примітки та прогрес читання - в синхроні на всіх
  пристроях

feature_09: >
  Плани читання та стеження за прогресом - прочитані розділи, активні дні й
  цикли читання - а також завчання віршів у режимах «Переплутані слова»,
  «Порядок слів», «Розмиті слова» та «Введи сам»

feature_11: >
  Опціональний ШІ-асистент - вимкнений за замовчуванням, потрібен власний
  API-ключ стороннього провайдера. Досліджуйте коментарі та словники з
  допомогою ШІ вашою мовою; система дозволів залишає контроль за вами.
