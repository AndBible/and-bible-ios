subtitle: "Offline-raamatuntutkimus"
keywords: "kommentaari,strong,kreikka,heprea,muistiinpano,korostus,lukusuunnitelma,kirjanmerkki,ulkoaopettelu"
promotional_text: >
  Ilmainen, avoimen lähdekoodin ja mainokseton. Jaetut näkymät, kommentaarit,
  Strong, tehokas haku, kirjanmerkit ja muistiinpanot – kaikki offline
  asennuksen jälkeen.
feature_08: >
  Synkronointi iCloudin tai NextCloud/WebDAVin kautta: pidä työtilat,
  kirjanmerkit, muistiinpanot ja lukuedistymä ajan tasalla kaikilla
  laitteillasi
feature_09: >
  Lukusuunnitelmat ja edistymisen seuranta – luetut luvut, aktiiviset päivät,
  lukukierrokset – sekä jakeiden ulkoa opettelu: Sanasekoitus, Sanajärjestys,
  Sanasumutu ja Sanatyyppi
feature_11: >
  Valinnainen tekoälyavustaja, pois käytöstä oletuksena – vaatii oman
  API-avaimen ulkoiselta palveluntarjoajalta. Tutki kommentaareja ja
  sanakirjoja tekoälyn avulla; lupajärjestelmä pitää sinut hallinnassa.
