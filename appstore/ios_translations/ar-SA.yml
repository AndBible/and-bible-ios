subtitle: "دراسة الكتاب المقدس دون اتصال"
keywords: "تفسير,سترونج,يونانية,عبرية,SWORD,قاموس,خرائط,ملاحظات,إبراز,حفظ,خطة قراءة,بحث,مزامنة"
promotional_text: >
  بلا إعلانات ومفتوح المصدر. طرق عرض مقسمة، تفاسير، أدوات Strong، بحث قوي،
  إشارات مرجعية وملاحظات - كل ذلك دون اتصال بعد تثبيت مستنداتك.
feature_08: >
  المزامنة بين الأجهزة عبر iCloud أو NextCloud/WebDAV: حافظ على تزامن مساحات
  العمل والإشارات المرجعية والملاحظات وتقدّم القراءة عبر جميع أجهزتك.
feature_09: >
  خطط القراءة وتتبع التقدّم - الفصول المقروءة، الأيام النشطة، ودورات القراءة -
  بالإضافة إلى حفظ الآيات بأوضاع ترتيب الحروف، ترتيب الكلمات، ضبابية الكلمات،
  والكتابة.
feature_11: >
  وكيل دراسة بالذكاء الاصطناعي اختياري - معطّل بشكل افتراضي، ويتطلب مفتاح API
  خاصًا بك من مزوّد خارجي. استكشف التفاسير والقواميس بمساعدة الذكاء الاصطناعي
  بلغتك؛ ونظام الأذونات يبقيك متحكمًا بالكامل.
