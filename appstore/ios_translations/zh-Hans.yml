subtitle: "离线圣经研经工具箱"
keywords: "注释,Strong's,希腊文,希伯来文,sword,书签,笔记,醒目提示,背经,阅读计划,工作检视"
promotional_text: >
  无广告、开源应用。分屏视图、注释、Strong's 参考、强大搜索、书签与笔记 - 文档下载后
  即可离线使用。
feature_08: >
  通过 iCloud 或 NextCloud/WebDAV 跨设备同步：在您的所有设备之间同步工作检视、书签、
  笔记及读经进度
feature_09: >
  阅读计划与进度追踪 - 已读章数、活跃天数及阅读周期 - 并通过「字词重组」「字词排序」
  「字词模糊」及「逐字输入」模式背诵经文
feature_11: >
  可选的 AI 研经助手 - 默认关闭，需您自备外部服务的 API 密钥。以您所选的语言，借助 AI
  探索您已安装的注释及字典。内建的权限系统让您能完全掌控助手可执行的操作。
