source_sha: 7850713027f82e0e51273ee6d85dfe04146d2c90020e87f0e2492f3e1f65a146
subtitle: "ชุดศึกษาพระคัมภีร์ออฟไลน์"
keywords: "คำอธิบาย,สตรอง,กรีก,ฮีบรู,SWORD,บันทึก,ไฮไลต์,จดจำ,แผนการอ่าน,ค้นหา,ซิงค์"
promotional_text: >
  ไม่มีโฆษณาและโอเพนซอร์ส แบ่งหน้าจอ คำอธิบายพระคัมภีร์ Strong's
  การค้นหาทรงพลัง ที่คั่นหน้าและบันทึก - ทั้งหมดออฟไลน์เมื่อติดตั้งเอกสารของคุณแล้ว
feature_08: >
  การซิงค์ข้ามอุปกรณ์ผ่าน iCloud หรือ NextCloud/WebDAV: รักษาพื้นที่ทำงาน
  ที่คั่นหน้า บันทึก และความคืบหน้าในการอ่านของคุณให้ตรงกันบนทุกอุปกรณ์
feature_09: >
  แผนการอ่านและการติดตามความคืบหน้า - บทที่อ่านแล้ว วันที่มีการอ่าน
  และรอบการอ่าน - พร้อมการท่องจำข้อพระคัมภีร์ด้วยโหมด สลับคำ เรียงคำ เบลอคำ
  และพิมพ์ตาม
feature_11: >
  ผู้ช่วยศึกษาพระคัมภีร์ AI ที่เป็นทางเลือก - ปิดอยู่โดยค่าเริ่มต้น
  ต้องใช้ API key ของคุณเองสำหรับบริการภายนอก
  สำรวจคำอธิบายและพจนานุกรมด้วยความช่วยเหลือจาก AI ในภาษาของคุณ
  พร้อมระบบสิทธิ์ที่ให้คุณควบคุมได้อย่างเต็มที่
