# App Store promotional text, max 170 characters.
promotional_text: >
  Без рекламы, с открытым кодом. Разделение экрана, комментарии, Стронг,
  мощный поиск, закладки и заметки — офлайн, как только модули установлены.

# --- Overrides of Android description keys ---

feature_08: >
  Синхронизация через iCloud или NextCloud/WebDAV: рабочие области, закладки,
  заметки и прогресс чтения — на всех ваших устройствах

feature_09: >
  Планы чтения и отслеживание прогресса — прочитанные главы, активные дни и
  циклы чтения — плюс заучивание стихов в режимах «Перемешанные слова»,
  «Порядок слов», «Размытые слова» и «Введите сами»

feature_11: >
  Опциональный ИИ-помощник — отключён по умолчанию, нужен свой API-ключ
  стороннего провайдера. Изучайте комментарии и словари с помощью ИИ; система
  разрешений оставляет контроль за вами.
