# App Store promotional text, max 170 characters.
promotional_text: >
  Tanpa iklan dan sumber terbuka. Paparan pisah, ulasan, Strong's, carian
  berkuasa, penanda buku dan nota - semuanya luar talian selepas dokumen
  dipasang.

# --- Overrides of Android description keys ---

feature_08: >
  Penyegerakan melalui iCloud atau NextCloud/WebDAV: pastikan ruang kerja,
  penanda buku, nota, dan kemajuan bacaan anda diselaraskan pada semua
  peranti anda

feature_09: >
  Pelan bacaan dan penjejakan kemajuan - bab dibaca, hari aktif dan kitaran
  bacaan - serta hafalan ayat dengan mod Susun Perkataan, Tertib Perkataan,
  Kabur Perkataan, dan Taipkan

feature_11: >
  Ejen kajian AI pilihan - dimatikan secara lalai, memerlukan kunci API
  pihak ketiga anda sendiri. Jelajahi ulasan dan kamus dengan bantuan AI
  dalam bahasa anda; sistem kebenaran mengekalkan kawalan anda.
