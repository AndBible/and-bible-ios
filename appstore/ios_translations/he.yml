subtitle: "כלי לימוד תנ\"ך במצב לא-מקוון"
keywords: "פרשנויות,STRONG,יוונית,עברית מקראית,SWORD,הערות,הדגשה,שינון,תוכנית קריאה,חיפוש,סנכרון"
promotional_text: >
  בקוד פתוח וללא פרסומות. תצוגות מפוצלות, פרשנויות, STRONG, חיפוש עוצמתי,
  סימניות והערות - הכל במצב לא-מקוון לאחר התקנת המסמכים שלך.
feature_08: >
  סנכרון בין מכשירים באמצעות iCloud או NextCloud/WebDAV: סביבות העבודה,
  הסימניות, ההערות וההתקדמות בקריאה שלך נשמרים מסונכרנים בין כל המכשירים שלך.
feature_09: >
  תוכניות קריאה ומעקב התקדמות - פרקים שנקראו, ימי קריאה פעילים ומחזורי קריאה -
  וכן שינון פסוקים במצבי ערבוב מילים, סדר מילים, טשטוש מילים והקלדה.
feature_11: >
  סוכן לימוד בינה מלאכותית אופציונלי - כבוי כברירת מחדל, ודורש מפתח API משלך
  לשירות חיצוני. חקור פרשנויות ומילונים בעזרת בינה מלאכותית בשפה שלך; מערכת
  הרשאות מבטיחה לך שליטה מלאה.
