promotional_text: >
  Reklamefri og åpen kildekode. Delt visning, kommentarer, Strong's, kraftig
  søk, bokmerker og notater - alt frakoblet når dokumentene er installert.

# --- Overrides of Android description keys ---

feature_08: >
  Synkronisering mellom enheter via iCloud eller NextCloud/WebDAV: hold
  arbeidsområder, bokmerker, notater og lesefremgang synkronisert på alle
  enhetene dine

feature_09: >
  Leseplaner og fremdriftssporing - leste kapitler, aktive dager og
  lesesykluser - pluss versmemorering med Bokstavkrøll, Ordrekkefølge,
  Ordutydning og Skriv selv

feature_11: >
  Valgfri AI-studieassistent - avslått som standard, krever din egen
  API-nøkkel fra en tredjepartstjeneste. Utforsk kommentarer og ordbøker med
  AI-hjelp på ditt språk; et tillatelsessystem gir deg kontrollen.
