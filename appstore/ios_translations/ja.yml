promotional_text: "広告なしのオープンソース。分割表示、注解書、ストロング番号、高度な検索、ブックマークとノートを完備 - 文書をインストールすればすべてオフラインで利用できます。"
feature_08: "iCloudまたはNextCloud/WebDAVによるデバイス間同期：ワークスペース、ブックマーク、ノート、読書進捗をすべてのデバイスで同期した状態に保てます"
feature_09: "通読プランと進捗トラッキング - 読んだ章数、活動日数、通読サイクル - に加え、ワードスクランブル、ワードオーダー、ワードブラー、タイプイットモードによる聖句の暗唱"
feature_11: "オプションのAI研究エージェント - デフォルトでオフ、外部サービスのご自身のAPIキーが必要です。お好みの言語でインストール済みの注解書や辞書をAIの支援を受けて探索できます。権限システムにより、常に完全にコントロールできます。"
