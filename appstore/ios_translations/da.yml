# App Store subtitle, max 30 characters.
subtitle: "Offline bibelstudieværktøj"

# App Store keywords, max 100 characters, comma separated, no spaces after
# commas.
keywords: "studie,offline,kommentar,strongs,græsk,hebraisk,sword,noter,markering,memorering,læseplan"

# App Store promotional text, max 170 characters.
promotional_text: >
  Uden reklamer og open source. Delt visning, kommentarer, Strong's, kraftfuld
  søgning, bogmærker og noter - helt offline, når dine dokumenter er installeret.

# --- Overrides of Android description keys ---

feature_08: >
  Synkronisering via iCloud eller NextCloud/WebDAV: hold dine arbejdsområder,
  bogmærker, noter og læsefremskridt synkroniseret på alle dine enheder

feature_09: >
  Læseplaner og fremskridtssporing - kapitler læst, aktive dage og læsecykler
  - samt versmemorering med tilstandene Ordrod, Ordrækkefølge, Sløret ord og
  Skriv selv

feature_11: >
  Valgfri AI-studieassistent - slået fra som standard, kræver din egen
  API-nøgle fra en ekstern udbyder. Udforsk kommentarer og ordbøger med
  AI-hjælp på dit sprog; et tilladelsessystem holder dig i kontrol.
