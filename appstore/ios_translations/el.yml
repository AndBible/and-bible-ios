subtitle: "Μελέτη Βίβλου εκτός σύνδεσης"
keywords: "σχόλια,strongs,ελληνικά,εβραϊκά,sword,σημειώσεις,υπογράμμιση,απομνημόνευση,σχέδιο ανάγνωσης,λεξικά"
promotional_text: >
  Χωρίς διαφημίσεις, ανοιχτού κώδικα. Διαχωρισμός προβολών, σχόλια, Strong,
  ισχυρή αναζήτηση, σελιδοδείκτες, σημειώσεις - όλα εκτός σύνδεσης μετά την
  εγκατάσταση εγγράφων.
feature_08: >
  Συγχρονισμός μεταξύ συσκευών μέσω iCloud ή NextCloud/WebDAV: χώροι εργασίας,
  σελιδοδείκτες, σημειώσεις και πρόοδος ανάγνωσης σε όλες τις συσκευές σας
feature_09: >
  Σχέδια ανάγνωσης και πρόοδος - διαβασμένα κεφάλαια, ενεργές ημέρες, κύκλοι
  ανάγνωσης - και απομνημόνευση στίχων με Word Scramble, Word Order, Word
  Blur και Type It
feature_11: >
  Προαιρετικός βοηθός μελέτης AI, απενεργοποιημένος από προεπιλογή, που
  απαιτεί δικό σας κλειδί API από τρίτο πάροχο. Εξερευνήστε σχόλια και
  λεξικά με τη βοήθεια AI στη γλώσσα σας· ένα σύστημα δικαιωμάτων σας κρατά
  σε πλήρη έλεγχο.
