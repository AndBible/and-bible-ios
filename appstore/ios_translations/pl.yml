# App Store promotional text, max 170 characters.
promotional_text: >
  Bez reklam i z otwartym kodem. Podzielony widok, komentarze, numeracja
  Stronga, potężne wyszukiwanie, zakładki i notatki - wszystko offline po
  zainstalowaniu dokumentów.

# --- Overrides of Android description keys ---

feature_08: >
  Synchronizacja między urządzeniami przez iCloud lub NextCloud/WebDAV:
  obszary robocze, zakładki, notatki i postęp czytania zawsze
  zsynchronizowane na wszystkich urządzeniach

feature_09: >
  Plany czytania i śledzenie postępów - przeczytane rozdziały, aktywne dni i
  cykle - a także zapamiętywanie wersetów w trybach Pomieszaj słowa,
  Kolejność słów, Zasłoń słowa i Wpisz tekst

feature_11: >
  Opcjonalny asystent AI do studium - wyłączony domyślnie, wymaga własnego
  klucza API do zewnętrznej usługi. Przeglądaj komentarze i słowniki z
  pomocą AI w swoim języku; system uprawnień zapewnia Ci kontrolę.
