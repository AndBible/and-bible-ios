promotional_text: >
  無廣告、開放原始碼。分割視窗、註釋、Strong's 參考、強大搜尋、書籤及筆記 - 文件下載後
  即可離線使用。
feature_08: >
  透過 iCloud 或 NextCloud/WebDAV 跨裝置同步：讓你的工作區、書籤、筆記及閱讀進度於所有
  裝置間保持同步
feature_09: >
  閱讀計劃與進度追蹤 - 已讀章數、活躍天數及閱讀週期 - 並透過「打亂單字」、「排列單字」、
  「模糊單字」及「輸入單字」模式記憶經文
feature_11: >
  可選的 AI 研經代理 - 預設關閉，需使用你自己的外部服務 API 金鑰。以你選擇的語言，藉助
  AI 探索你已安裝的註釋及字典。內建的權限系統讓你完全掌控代理可執行的操作。
