subtitle: "오프라인 성경 공부 도구 모음"
keywords: "주석,스트롱코드,헬라어,히브리어,sword,노트,하이라이트,암송,읽기계획,워크스페이스"
promotional_text: >
  광고 없는 오픈소스 앱입니다. 창 분할, 주석, 스트롱코드, 강력한 검색, 북마크와 노트까지 -
  문서를 설치하면 모두 오프라인으로 이용할 수 있습니다.
feature_08: >
  iCloud 또는 NextCloud/WebDAV를 통한 기기 간 동기화: 워크스페이스, 북마크, 노트, 읽기
  진행 상황을 모든 기기에서 동기화된 상태로 유지하세요
feature_09: >
  읽기 계획과 진행 상황 추적 - 읽은 장, 활동한 날, 읽기 주기 - 그리고 단어 뒤섞기, 단어
  순서 맞추기, 단어 흐림, 직접 입력하기 모드로 구절 암송까지
feature_11: >
  선택 사항인 AI 공부 도우미 - 기본적으로 꺼져 있으며, 외부 서비스의 본인 API 키가
  필요합니다. 원하는 언어로 설치된 주석과 사전을 AI의 도움을 받아 탐색하세요. 권한
  시스템으로 항상 완전히 통제할 수 있습니다.
