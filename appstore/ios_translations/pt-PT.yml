subtitle: "Ferramenta bíblica offline"

keywords: "estudo,comentário,concordância,grego,hebraico,sword,notas,destaque,memorizar,plano leitura"

promotional_text: >
  Sem anúncios e de código aberto. Vistas divididas, comentários, Strong's,
  pesquisa avançada, marcadores e notas - tudo offline após instalar os
  documentos.

feature_08: >
  Sincronização via iCloud ou NextCloud/WebDAV: mantenha ambientes de
  trabalho, marcadores, notas e progresso de leitura em todos os seus
  dispositivos

feature_09: >
  Planos de leitura e acompanhamento do progresso - capítulos lidos, dias
  ativos e ciclos de leitura - além de memorização com os modos Palavras
  Baralhadas, Ordem das Palavras, Palavras Desfocadas e Escrever

feature_11: >
  Agente de estudo com IA opcional - desativado por predefinição, requer
  chave de API própria de terceiros. Explore comentários e dicionários com
  ajuda da IA no seu idioma; um sistema de permissões mantém-no no controlo.
