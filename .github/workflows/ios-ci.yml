name: iOS CI

on:
  pull_request:
    types: [opened,reopened,ready_for_review,synchronize]

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.3"
  UI_TEST_MIN_SHARD_COUNT: "2"
  UI_TEST_MAX_SHARD_COUNT: "4"
  UI_TEST_TARGET_SHARD_DURATION_SECONDS: "600"
  UI_TEST_TIMEOUT_MINUTES: "90"
  UI_TEST_TIMINGS_FILE: scripts/ui_test_timings.json

jobs:
  repo-standards:
    name: Repo Standards
    runs-on: ubuntu-latest
    outputs:
      required_checks_only: ${{ steps.classify.outputs.required_checks_only }}
      run_ui_build_product_reuse_experiment: ${{ steps.classify.outputs.run_ui_build_product_reuse_experiment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify change set
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
            head="${PR_HEAD_SHA}"
          else
            base="${PUSH_BEFORE_SHA}"
            head="${CURRENT_SHA}"
          fi

          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            mapfile -t changed_files < <(git diff-tree --no-commit-id --name-only -r "${head}")
          else
            mapfile -t changed_files < <(git diff --name-only "${base}" "${head}")
          fi

          required_checks_only=true
          run_ui_build_product_reuse_experiment=false
          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            required_checks_only=false
          fi

          for path in "${changed_files[@]}"; do
            echo "changed: ${path}"
            case "${path}" in
              .github/workflows/ios-ci.yml)
                run_ui_build_product_reuse_experiment=true
                ;;
            esac
            case "${path}" in
              docs/*|*.md|.github/workflows/ios-ci.yml)
                ;;
              *)
                required_checks_only=false
                ;;
            esac
          done

          echo "required_checks_only=${required_checks_only}"
          echo "required_checks_only=${required_checks_only}" >> "${GITHUB_OUTPUT}"
          echo "run_ui_build_product_reuse_experiment=${run_ui_build_product_reuse_experiment}"
          echo "run_ui_build_product_reuse_experiment=${run_ui_build_product_reuse_experiment}" >> "${GITHUB_OUTPUT}"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run repo standards unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Check bridge parity inventory
        run: python3 scripts/check_bridge_parity_inventory.py

      - name: Check commit messages (pull request range)
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/check_repo_standards.py commits
          --base-ref "origin/${{ github.base_ref }}"
          --head-ref HEAD

      - name: Check commit messages (push head commit)
        if: github.event_name == 'push'
        run: python3 scripts/check_repo_standards.py commits

      - name: Check Swift docblock style (full repo on pull request)
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/check_repo_standards.py docblocks
          --base-ref "origin/${{ github.base_ref }}"
          --head-ref HEAD
          --all-files

      - name: Check Swift docblock style (full repo on push)
        if: github.event_name == 'push'
        run: python3 scripts/check_repo_standards.py docblocks --all-files

  localization-guardrails:
    name: Localization Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run SETPAR-603 guardrails
        run: python3 scripts/check_settings_localization_guardrails.py

  bibleview-js:
    name: BibleView JS
    runs-on: ubuntu-latest
    needs:
      - repo-standards
    if: needs.repo-standards.outputs.required_checks_only != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bibleview-js/package-lock.json

      - name: Install frontend dependencies
        working-directory: bibleview-js
        run: npm ci

      - name: Run frontend tests
        working-directory: bibleview-js
        run: npm run test:ci

      - name: Build frontend debug bundle
        working-directory: bibleview-js
        run: npm run build-debug

  ui-shard-plan:
    name: Plan UI Test Shards
    runs-on: ubuntu-latest
    if: needs.repo-standards.outputs.required_checks_only != 'true'
    needs:
      - repo-standards
      - localization-guardrails
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate UI shard matrix
        id: plan
        run: >-
          python3 -u scripts/build_ui_test_shards.py
          --test-file AndBibleUITests/AndBibleUITests*.swift
          --timings-file "${UI_TEST_TIMINGS_FILE}"
          --shard-count "${UI_TEST_MIN_SHARD_COUNT}"
          --target-shard-duration-seconds "${UI_TEST_TARGET_SHARD_DURATION_SECONDS}"
          --max-shard-count "${UI_TEST_MAX_SHARD_COUNT}"
          --timeout-minutes "${UI_TEST_TIMEOUT_MINUTES}"
          --github-output "${GITHUB_OUTPUT}"

  ios-ui-foundation:
    name: Prepare UI Test Foundation
    runs-on: macos-15
    if: needs.repo-standards.outputs.required_checks_only != 'true'
    needs:
      - repo-standards
      - localization-guardrails
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Restore libsword build cache
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        uses: actions/cache@v5
        with:
          path: |
            libsword/sword-src
            libsword/build
            libsword/libsword.xcframework
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-libsword-hosttool-${{ hashFiles('libsword/build-ios.sh') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-libsword-hosttool-

      - name: Show Xcode version
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        run: xcodebuild -version

      - name: Ensure libsword build prerequisites
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi
          if ! command -v svn >/dev/null 2>&1; then
            brew install subversion
          fi

      - name: Build libsword XCFramework
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        working-directory: libsword
        env:
          INCLUDE_MACOS_SLICE: "1"
        run: |
          if [ -f libsword.xcframework/macos-arm64_x86_64/libsword.a ] && [ -f libsword.xcframework/ios-arm64/libsword.a ] && [ -f libsword.xcframework/ios-arm64_x86_64-simulator/libsword.a ]; then
            echo "Using cached libsword.xcframework"
          else
            ./build-ios.sh
          fi

      - name: Upload prepared libsword XCFramework
        id: upload_libsword_xcframework
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: libsword-hosttool-xcframework
          path: libsword/libsword.xcframework
          if-no-files-found: error
          retention-days: 1

      - name: Retry upload prepared libsword XCFramework
        if: needs.repo-standards.outputs.required_checks_only != 'true' && steps.upload_libsword_xcframework.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: libsword-hosttool-xcframework
          path: libsword/libsword.xcframework
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  ios-ui-build-product-reuse-producer:
    name: UI Build Product Reuse Producer
    runs-on: macos-15
    if: >-
      ${{
        needs.repo-standards.outputs.run_ui_build_product_reuse_experiment == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'ci:ui-build-reuse')
      }}
    needs:
      - repo-standards
      - localization-guardrails
    timeout-minutes: 60
    env:
      DERIVED_DATA_PATH: .derivedData
      BUILD_PRODUCTS_ARTIFACT_ROOT: .artifacts/ui-build-product-reuse
      BUILD_XCRESULT_BUNDLE_PATH: .artifacts/AndBibleBuild-ui-build-product-reuse.xcresult
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Restore SwiftPM and build caches
        uses: actions/cache@v5
        with:
          path: |
            .derivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-${{ hashFiles('Package.swift', 'AndBible.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-

      - name: Restore libsword build cache
        uses: actions/cache@v5
        with:
          path: |
            libsword/sword-src
            libsword/build
            libsword/libsword.xcframework
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-libsword-hosttool-${{ hashFiles('libsword/build-ios.sh') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-libsword-hosttool-

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Ensure iOS simulator runtime is available
        run: |
          if xcrun simctl list runtimes available | grep -Fq 'iOS '; then
            echo "An iOS simulator runtime is already installed."
          else
            echo "No iOS simulator runtime was found; downloading it for the selected Xcode."
            xcodebuild -downloadPlatform iOS
          fi

      - name: Ensure libsword build prerequisites
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi
          if ! command -v svn >/dev/null 2>&1; then
            brew install subversion
          fi

      - name: Build libsword XCFramework
        working-directory: libsword
        env:
          INCLUDE_MACOS_SLICE: "1"
        run: |
          if [ -f libsword.xcframework/macos-arm64_x86_64/libsword.a ] && [ -f libsword.xcframework/ios-arm64/libsword.a ] && [ -f libsword.xcframework/ios-arm64_x86_64-simulator/libsword.a ]; then
            echo "Using cached libsword.xcframework"
          else
            ./build-ios.sh
          fi

      - name: Resolve iOS simulator destination
        id: simulator
        run: >-
          python3 scripts/resolve_ios_simulator_destination.py
          --project AndBible.xcodeproj
          --scheme AndBible
          --create-dedicated-device
          --device-name-prefix "AndBible CI UI Reuse Producer"

      - name: Boot selected simulator
        run: >-
          python3 scripts/wait_for_simulator_boot.py
          --simulator-id "${{ steps.simulator.outputs.simulator_id }}"
          --timeout-seconds 300

      - name: Build for testing
        run: |
          mkdir -p .artifacts
          python3 -u scripts/run_xcodebuild_with_test_selection.py \
            --project AndBible.xcodeproj \
            --scheme AndBible \
            --configuration Debug \
            --destination "${{ steps.simulator.outputs.destination }}" \
            --derived-data-path "${DERIVED_DATA_PATH}" \
            --result-bundle-path "${BUILD_XCRESULT_BUNDLE_PATH}" \
            --code-signing-allowed NO \
            --action build-for-testing

      - name: Build host-side UI fixture tool
        run: swift build --package-path . --product UITestFixtureTool

      - name: Stage reusable UI build products
        run: |
          set -euo pipefail

          products_path="${DERIVED_DATA_PATH}/Build/Products"
          if [[ ! -d "${products_path}" ]]; then
            echo "Expected Xcode build products at ${products_path}."
            exit 1
          fi

          mapfile -t xctestrun_files < <(find "${products_path}" -maxdepth 1 -name "*.xctestrun" -print)
          if [[ "${#xctestrun_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one .xctestrun in ${products_path}; found ${#xctestrun_files[@]}."
            printf '%s\n' "${xctestrun_files[@]}"
            exit 1
          fi

          if [[ ! -x .build/debug/UITestFixtureTool ]]; then
            echo "Expected host-side UI fixture tool at .build/debug/UITestFixtureTool."
            exit 1
          fi

          rm -rf "${BUILD_PRODUCTS_ARTIFACT_ROOT}"
          mkdir -p "${BUILD_PRODUCTS_ARTIFACT_ROOT}/.derivedData/Build"
          mkdir -p "${BUILD_PRODUCTS_ARTIFACT_ROOT}/.build/debug"
          ditto "${products_path}" "${BUILD_PRODUCTS_ARTIFACT_ROOT}/.derivedData/Build/Products"
          ditto ".build/debug/UITestFixtureTool" "${BUILD_PRODUCTS_ARTIFACT_ROOT}/.build/debug/UITestFixtureTool"

          echo "Staged reusable Xcode products:"
          find "${BUILD_PRODUCTS_ARTIFACT_ROOT}/.derivedData/Build/Products" -maxdepth 2 -print | sort
          echo "Staged host fixture tool:"
          ls -l "${BUILD_PRODUCTS_ARTIFACT_ROOT}/.build/debug/UITestFixtureTool"

          tar -czf .artifacts/ui-build-product-reuse.tar.gz -C "${BUILD_PRODUCTS_ARTIFACT_ROOT}" .
          ls -lh .artifacts/ui-build-product-reuse.tar.gz

      - name: Upload reusable UI build products
        id: upload_reusable_ui_build_products
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: andbible-ui-build-products-${{ github.run_id }}
          path: .artifacts/ui-build-product-reuse.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Retry upload reusable UI build products
        if: steps.upload_reusable_ui_build_products.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: andbible-ui-build-products-${{ github.run_id }}
          path: .artifacts/ui-build-product-reuse.tar.gz
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Upload reuse producer xcodebuild result bundle
        id: upload_reuse_producer_xcresult
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: andbible-xcresult-${{ github.run_id }}-ui-reuse-producer
          path: .artifacts/*.xcresult
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Retry upload reuse producer xcodebuild result bundle
        if: always() && steps.upload_reuse_producer_xcresult.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: andbible-xcresult-${{ github.run_id }}-ui-reuse-producer
          path: .artifacts/*.xcresult
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          overwrite: true

      - name: Delete dedicated simulator
        if: always() && steps.simulator.outputs.simulator_created == 'true'
        run: xcrun simctl delete "${{ steps.simulator.outputs.simulator_id }}"

  ios-ui-build-product-reuse-consumer:
    name: UI Build Product Reuse Consumer
    runs-on: macos-15
    needs:
      - ios-ui-build-product-reuse-producer
    timeout-minutes: 30
    env:
      DERIVED_DATA_PATH: .derivedData
      TEST_XCRESULT_BUNDLE_PATH: .artifacts/AndBibleTests-ui-build-product-reuse.xcresult
      TEST_SELECTION_ARGS: |-
        -only-testing:AndBibleUITests/AndBibleUITests/testAboutScreenOpensFromReaderMenu
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Download reusable UI build products
        uses: actions/download-artifact@v5
        with:
          name: andbible-ui-build-products-${{ github.run_id }}
          path: .artifacts/reuse-download

      - name: Verify restored UI build products
        id: restored_products
        run: |
          set -euo pipefail

          tar -xzf .artifacts/reuse-download/ui-build-product-reuse.tar.gz -C .

          products_path="${DERIVED_DATA_PATH}/Build/Products"
          if [[ ! -d "${products_path}" ]]; then
            echo "Expected restored Xcode build products at ${products_path}."
            exit 1
          fi

          mapfile -t xctestrun_files < <(find "${products_path}" -maxdepth 1 -name "*.xctestrun" -print)
          if [[ "${#xctestrun_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one restored .xctestrun in ${products_path}; found ${#xctestrun_files[@]}."
            printf '%s\n' "${xctestrun_files[@]}"
            exit 1
          fi

          if [[ ! -f .build/debug/UITestFixtureTool ]]; then
            echo "Expected restored host-side UI fixture tool at .build/debug/UITestFixtureTool."
            exit 1
          fi
          chmod +x .build/debug/UITestFixtureTool

          echo "xctestrun_path=${xctestrun_files[0]}" >> "${GITHUB_OUTPUT}"
          echo "Restored reusable Xcode products:"
          find "${products_path}" -maxdepth 2 -print | sort

      - name: Ensure iOS simulator runtime is available
        run: |
          if xcrun simctl list runtimes available | grep -Fq 'iOS '; then
            echo "An iOS simulator runtime is already installed."
          else
            echo "No iOS simulator runtime was found; downloading it for the selected Xcode."
            xcodebuild -downloadPlatform iOS
          fi

      - name: Resolve iOS simulator destination
        id: simulator
        run: >-
          python3 scripts/resolve_ios_simulator_destination.py
          --project AndBible.xcodeproj
          --scheme AndBible
          --create-dedicated-device
          --device-name-prefix "AndBible CI UI Reuse Consumer"

      - name: Boot selected simulator
        run: >-
          python3 scripts/wait_for_simulator_boot.py
          --simulator-id "${{ steps.simulator.outputs.simulator_id }}"
          --timeout-seconds 300

      - name: Run reused UI build products without rebuilding
        env:
          UITEST_FIXTURE_TOOL_PATH: ${{ github.workspace }}/.build/debug/UITestFixtureTool
          UITEST_BUNDLE_ID: org.andbible.ios
          UITEST_SIMULATOR_ID: ${{ steps.simulator.outputs.simulator_id }}
        run: |
          mkdir -p .artifacts
          python3 -u scripts/run_xcodebuild_with_test_selection.py \
            --xctestrun-path "${{ steps.restored_products.outputs.xctestrun_path }}" \
            --destination "${{ steps.simulator.outputs.destination }}" \
            --result-bundle-path "${TEST_XCRESULT_BUNDLE_PATH}" \
            --code-signing-allowed NO \
            --action test-without-building

      - name: Upload reuse consumer xcodebuild result bundle
        id: upload_reuse_consumer_xcresult
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: andbible-xcresult-${{ github.run_id }}-ui-reuse-consumer
          path: .artifacts/*.xcresult
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Retry upload reuse consumer xcodebuild result bundle
        if: always() && steps.upload_reuse_consumer_xcresult.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: andbible-xcresult-${{ github.run_id }}-ui-reuse-consumer
          path: .artifacts/*.xcresult
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          overwrite: true

      - name: Delete dedicated simulator
        if: always() && steps.simulator.outputs.simulator_created == 'true'
        run: xcrun simctl delete "${{ steps.simulator.outputs.simulator_id }}"

  ios-simulator-unit-tests:
    name: Unit Tests (Simulator)
    runs-on: ${{ needs.repo-standards.outputs.required_checks_only == 'true' && 'ubuntu-latest' || 'macos-15' }}
    needs:
      - repo-standards
      - localization-guardrails
    timeout-minutes: 60
    env:
      DERIVED_DATA_PATH: .derivedData
      BUILD_XCRESULT_BUNDLE_PATH: .artifacts/AndBibleBuild-unit.xcresult
      TEST_XCRESULT_BUNDLE_PATH: .artifacts/AndBibleTests-unit.xcresult
      TEST_SELECTION_ARGS: |-
        -skip-testing:AndBibleUITests
        -skip-testing:AndBibleTests/AndBibleTests/testBridgeBindsWeakWebViewReferenceFromLifecycleCallbacks
    steps:
      - name: Required-checks-only pass
        if: needs.repo-standards.outputs.required_checks_only == 'true'
        run: echo "Required-checks-only change set; simulator unit tests are not required."

      - name: Checkout
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        uses: actions/checkout@v6

      - name: Select Xcode version
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Restore SwiftPM and build caches
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        uses: actions/cache@v5
        with:
          path: |
            .derivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-${{ hashFiles('Package.swift', 'AndBible.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-

      - name: Restore libsword build cache
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        uses: actions/cache@v5
        with:
          path: |
            libsword/sword-src
            libsword/build
            libsword/libsword.xcframework
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-libsword-iosonly-${{ hashFiles('libsword/build-ios.sh') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-libsword-iosonly-

      - name: Show Xcode version
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        run: xcodebuild -version

      - name: Ensure iOS simulator runtime is available
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        run: |
          if xcrun simctl list runtimes available | grep -Fq 'iOS '; then
            echo "An iOS simulator runtime is already installed."
          else
            echo "No iOS simulator runtime was found; downloading it for the selected Xcode."
            xcodebuild -downloadPlatform iOS
          fi

      - name: Ensure libsword build prerequisites
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi
          if ! command -v svn >/dev/null 2>&1; then
            brew install subversion
          fi

      - name: Build libsword XCFramework
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        working-directory: libsword
        env:
          INCLUDE_MACOS_SLICE: "0"
        run: |
          if [ -f libsword.xcframework/ios-arm64/libsword.a ] && [ -f libsword.xcframework/ios-arm64_x86_64-simulator/libsword.a ]; then
            echo "Using cached libsword.xcframework"
          else
            ./build-ios.sh
          fi

      - name: Resolve iOS simulator destination
        id: simulator
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        run: >-
          python3 -u scripts/resolve_ios_simulator_destination.py
          --project AndBible.xcodeproj
          --scheme AndBible
          --create-dedicated-device
          --device-name-prefix "AndBible CI Unit"

      - name: Boot selected simulator
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        run: >-
          python3 -u scripts/wait_for_simulator_boot.py
          --simulator-id "${{ steps.simulator.outputs.simulator_id }}"
          --timeout-seconds 300

      - name: Build for testing
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        run: |
          mkdir -p .artifacts
          python3 -u scripts/run_xcodebuild_with_test_selection.py \
            --project AndBible.xcodeproj \
            --scheme AndBible \
            --configuration Debug \
            --destination "${{ steps.simulator.outputs.destination }}" \
            --derived-data-path "${DERIVED_DATA_PATH}" \
            --result-bundle-path "${BUILD_XCRESULT_BUNDLE_PATH}" \
            --code-signing-allowed NO \
            --action build-for-testing

      - name: Run selected simulator tests without rebuilding
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        timeout-minutes: 10
        run: |
          python3 -u scripts/run_xcodebuild_with_test_selection.py \
            --project AndBible.xcodeproj \
            --scheme AndBible \
            --configuration Debug \
            --destination "${{ steps.simulator.outputs.destination }}" \
            --derived-data-path "${DERIVED_DATA_PATH}" \
            --result-bundle-path "${TEST_XCRESULT_BUNDLE_PATH}" \
            --code-signing-allowed NO \
            --action test-without-building

      - name: Upload xcodebuild test result bundle
        id: upload_unit_xcresult
        if: always() && needs.repo-standards.outputs.required_checks_only != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: andbible-xcresult-${{ github.run_id }}-unit
          path: .artifacts/*.xcresult
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Retry upload xcodebuild test result bundle
        if: always() && needs.repo-standards.outputs.required_checks_only != 'true' && steps.upload_unit_xcresult.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: andbible-xcresult-${{ github.run_id }}-unit
          path: .artifacts/*.xcresult
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          overwrite: true

      - name: Delete dedicated simulator
        if: always() && needs.repo-standards.outputs.required_checks_only != 'true' && steps.simulator.outputs.simulator_created == 'true'
        run: xcrun simctl delete "${{ steps.simulator.outputs.simulator_id }}"

  ios-simulator-ui-tests:
    name: ${{ matrix.job_name }}
    runs-on: macos-15
    if: needs.repo-standards.outputs.required_checks_only != 'true'
    needs:
      - repo-standards
      - ui-shard-plan
      - ios-ui-foundation
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.ui-shard-plan.outputs.matrix) }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    env:
      DERIVED_DATA_PATH: .derivedData
      BUILD_XCRESULT_BUNDLE_PATH: ${{ matrix.build_xcresult_bundle_path }}
      TEST_XCRESULT_BUNDLE_PATH: ${{ matrix.test_xcresult_bundle_path }}
      TEST_SELECTION_ARGS: ${{ matrix.test_selection_args }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Restore SwiftPM and build caches
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        uses: actions/cache@v5
        with:
          path: |
            .derivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-${{ hashFiles('Package.swift', 'AndBible.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-

      - name: Restore libsword build cache
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        uses: actions/cache@v5
        with:
          path: |
            libsword/sword-src
            libsword/build
            libsword/libsword.xcframework
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-libsword-hosttool-${{ hashFiles('libsword/build-ios.sh') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-libsword-hosttool-

      - name: Download prepared libsword XCFramework
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        uses: actions/download-artifact@v5
        with:
          name: libsword-hosttool-xcframework
          path: libsword

      - name: Show Xcode version
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        run: xcodebuild -version

      - name: Ensure iOS simulator runtime is available
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        run: |
          if xcrun simctl list runtimes available | grep -Fq 'iOS '; then
            echo "An iOS simulator runtime is already installed."
          else
            echo "No iOS simulator runtime was found; downloading it for the selected Xcode."
            xcodebuild -downloadPlatform iOS
          fi

      - name: Ensure libsword build prerequisites
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi
          if ! command -v svn >/dev/null 2>&1; then
            brew install subversion
          fi

      - name: Build libsword XCFramework
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        working-directory: libsword
        env:
          INCLUDE_MACOS_SLICE: "1"
        run: |
          if [ -f libsword.xcframework/macos-arm64_x86_64/libsword.a ] && [ -f libsword.xcframework/ios-arm64/libsword.a ] && [ -f libsword.xcframework/ios-arm64_x86_64-simulator/libsword.a ]; then
            echo "Using cached libsword.xcframework"
          else
            ./build-ios.sh
          fi

      - name: Resolve iOS simulator destination
        id: simulator
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        run: >-
          python3 scripts/resolve_ios_simulator_destination.py
          --project AndBible.xcodeproj
          --scheme AndBible
          --create-dedicated-device
          --device-name-prefix "AndBible CI UI"

      - name: Boot selected simulator
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        run: >-
          python3 scripts/wait_for_simulator_boot.py
          --simulator-id "${{ steps.simulator.outputs.simulator_id }}"
          --timeout-seconds 300

      - name: Build for testing
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        run: |
          mkdir -p .artifacts
          python3 -u scripts/run_xcodebuild_with_test_selection.py \
            --project AndBible.xcodeproj \
            --scheme AndBible \
            --configuration Debug \
            --destination "${{ steps.simulator.outputs.destination }}" \
            --derived-data-path "${DERIVED_DATA_PATH}" \
            --result-bundle-path "${BUILD_XCRESULT_BUNDLE_PATH}" \
            --code-signing-allowed NO \
            --action build-for-testing

      - name: Build host-side UI fixture tool
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        run: swift build --package-path . --product UITestFixtureTool

      - name: Run selected simulator tests without rebuilding
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        env:
          UITEST_FIXTURE_TOOL_PATH: ${{ github.workspace }}/.build/debug/UITestFixtureTool
          UITEST_BUNDLE_ID: org.andbible.ios
          UITEST_SIMULATOR_ID: ${{ steps.simulator.outputs.simulator_id }}
        run: |
          python3 -u scripts/run_xcodebuild_with_test_selection.py \
            --project AndBible.xcodeproj \
            --scheme AndBible \
            --configuration Debug \
            --destination "${{ steps.simulator.outputs.destination }}" \
            --derived-data-path "${DERIVED_DATA_PATH}" \
            --result-bundle-path "${TEST_XCRESULT_BUNDLE_PATH}" \
            --code-signing-allowed NO \
            --action test-without-building

      - name: Upload xcodebuild test result bundle
        id: upload_ui_xcresult
        if: always() && needs.repo-standards.outputs.required_checks_only != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: andbible-xcresult-${{ github.run_id }}-${{ matrix.artifact_suffix }}
          path: .artifacts/*.xcresult
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Retry upload xcodebuild test result bundle
        if: always() && needs.repo-standards.outputs.required_checks_only != 'true' && steps.upload_ui_xcresult.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: andbible-xcresult-${{ github.run_id }}-${{ matrix.artifact_suffix }}
          path: .artifacts/*.xcresult
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          overwrite: true

      - name: Delete dedicated simulator
        if: always() && needs.repo-standards.outputs.required_checks_only != 'true' && steps.simulator.outputs.simulator_created == 'true'
        run: xcrun simctl delete "${{ steps.simulator.outputs.simulator_id }}"
