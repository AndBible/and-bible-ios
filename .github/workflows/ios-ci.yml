name: iOS CI

on:
  pull_request:
    types: [opened,reopened,ready_for_review,synchronize]

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.3"
  UI_TEST_MIN_SHARD_COUNT: "2"
  UI_TEST_MAX_SHARD_COUNT: "4"
  UI_TEST_TARGET_SHARD_DURATION_SECONDS: "600"
  UI_TEST_TIMEOUT_MINUTES: "90"
  UI_TEST_TIMINGS_FILE: Tests/UI/Fixtures/ui_test_timings.json
  ANDBIBLE_ANDROID_ROOT: ../and-bible
  ANDBIBLE_ANDROID_REF: 0f3b85823cebbfafeb5a51675827f5314cac3c56

jobs:
  repo-standards:
    name: Repo Standards
    runs-on: ubuntu-latest
    outputs:
      required_checks_only: ${{ steps.classify.outputs.required_checks_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify change set
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
            head="${PR_HEAD_SHA}"
          else
            base="${PUSH_BEFORE_SHA}"
            head="${CURRENT_SHA}"
          fi

          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            mapfile -t changed_files < <(git diff-tree --no-commit-id --name-only -r "${head}")
          else
            mapfile -t changed_files < <(git diff --name-only "${base}" "${head}")
          fi

          required_checks_only=true
          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            required_checks_only=false
          fi

          for path in "${changed_files[@]}"; do
            echo "changed: ${path}"
            case "${path}" in
              docs/*|*.md|.github/workflows/ios-ci.yml)
                ;;
              *)
                required_checks_only=false
                ;;
            esac
          done

          echo "required_checks_only=${required_checks_only}"
          echo "required_checks_only=${required_checks_only}" >> "${GITHUB_OUTPUT}"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Checkout Android reference
        run: scripts/ensure_android_reference_checkout.sh

      - name: Check Android workspace Room authority
        run: python3 scripts/check_android_workspace_schema_authority.py

      - name: Check Android AI settings Room authority
        run: python3 scripts/check_android_ai_settings_schema_authority.py

      - name: Run repo standards unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Check bridge parity inventory
        run: python3 scripts/check_bridge_parity_inventory.py

      - name: Check static source guardrails
        run: python3 scripts/check_repo_standards.py source-guards

      - name: Check commit messages (pull request range)
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/check_repo_standards.py commits
          --base-ref "origin/${{ github.base_ref }}"
          --head-ref HEAD

      - name: Check commit messages (push head commit)
        if: github.event_name == 'push'
        run: python3 scripts/check_repo_standards.py commits

      - name: Check Swift docblock style (full repo on pull request)
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/check_repo_standards.py docblocks
          --base-ref "origin/${{ github.base_ref }}"
          --head-ref HEAD
          --all-files

      - name: Check Swift docblock style (full repo on push)
        if: github.event_name == 'push'
        run: python3 scripts/check_repo_standards.py docblocks --all-files

  localization-guardrails:
    name: Localization Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout Android reference
        run: scripts/ensure_android_reference_checkout.sh

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run SETPAR-603 guardrails
        run: python3 scripts/check_settings_localization_guardrails.py

  appstore-metadata:
    name: App Store metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python3 -m pip install --requirement scripts/requirements-appstore.txt

      - name: Check out the Android store copy at the pinned commit
        run: |
          set -euo pipefail
          sha="$(grep -v '^#' appstore/android_source.lock | head -n 1 | tr -d '[:space:]')"
          git init ../and-bible
          git -C ../and-bible fetch --depth 1 https://github.com/AndBible/and-bible.git "$sha"
          git -C ../and-bible checkout --detach FETCH_HEAD

      - name: Run the metadata unit tests
        run: python3 -m unittest discover -s scripts -p 'test_appstore_metadata.py' -v

      - name: Check the metadata tree for drift
        run: python3 scripts/assemble_appstore_metadata.py --check --require-pinned

  ios-swordkit-package-tests:
    name: SwordKit Package Tests (Simulator)
    runs-on: ${{ needs.repo-standards.outputs.required_checks_only == 'true' && 'ubuntu-latest' || 'macos-15' }}
    needs:
      - repo-standards
      - localization-guardrails
    timeout-minutes: 30
    env:
      DERIVED_DATA_PATH: .derivedData/SwordKitPackageTests
      TEST_XCRESULT_BUNDLE_PATH: .artifacts/SwordKitTests-package.xcresult
    steps:
      - name: Required-checks-only pass
        if: needs.repo-standards.outputs.required_checks_only == 'true'
        run: echo "Required-checks-only change set; SwordKit package tests are not required."

      - name: Checkout
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        uses: actions/checkout@v6

      - name: Select Xcode version
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Restore SwiftPM and build caches
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        uses: actions/cache@v5
        with:
          path: |
            .derivedData/SwordKitPackageTests/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-swordkit-package-${{ hashFiles('Package.swift', 'Sources/SwordKit/**', 'libsword/build-ios.sh') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-swordkit-package-

      - name: Restore libsword build cache
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        uses: actions/cache@v5
        with:
          path: |
            libsword/sword-src
            libsword/build
            libsword/libsword.xcframework
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-libsword-iosonly-${{ hashFiles('libsword/build-ios.sh') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-libsword-iosonly-

      - name: Show Xcode version
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        run: xcodebuild -version

      - name: Ensure iOS simulator runtime is available
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        run: |
          if xcrun simctl list runtimes available | grep -Fq 'iOS '; then
            echo "An iOS simulator runtime is already installed."
          else
            echo "No iOS simulator runtime was found; downloading it for the selected Xcode."
            xcodebuild -downloadPlatform iOS
          fi

      - name: Ensure libsword build prerequisites
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi
          if ! command -v svn >/dev/null 2>&1; then
            brew install subversion
          fi

      - name: Build libsword XCFramework
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        working-directory: libsword
        env:
          INCLUDE_MACOS_SLICE: "0"
        run: |
          if [ -f libsword.xcframework/ios-arm64/libsword.a ] && [ -f libsword.xcframework/ios-arm64_x86_64-simulator/libsword.a ]; then
            echo "Using cached libsword.xcframework"
          else
            ./build-ios.sh
          fi

      - name: Resolve iOS simulator destination
        id: simulator
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        run: >-
          python3 -u scripts/resolve_ios_simulator_destination.py
          --project AndBible.xcodeproj
          --scheme SwordKitTests
          --create-dedicated-device
          --device-name-prefix "AndBible CI SwordKit"

      - name: Boot selected simulator
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        run: >-
          python3 -u scripts/wait_for_simulator_boot.py
          --simulator-id "${{ steps.simulator.outputs.simulator_id }}"
          --timeout-seconds 300

      - name: Run SwordKit package tests
        if: needs.repo-standards.outputs.required_checks_only != 'true'
        timeout-minutes: 10
        run: |
          mkdir -p .artifacts
          xcodebuild test \
            -project AndBible.xcodeproj \
            -scheme SwordKitTests \
            -configuration Debug \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -resultBundlePath "${TEST_XCRESULT_BUNDLE_PATH}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload SwordKit package test result bundle
        id: upload_swordkit_package_xcresult
        if: always() && needs.repo-standards.outputs.required_checks_only != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: andbible-xcresult-${{ github.run_id }}-swordkit-package
          path: .artifacts/*.xcresult
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Retry upload SwordKit package test result bundle
        if: always() && needs.repo-standards.outputs.required_checks_only != 'true' && steps.upload_swordkit_package_xcresult.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: andbible-xcresult-${{ github.run_id }}-swordkit-package
          path: .artifacts/*.xcresult
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          overwrite: true

      - name: Delete dedicated simulator
        if: always() && needs.repo-standards.outputs.required_checks_only != 'true' && steps.simulator.outputs.simulator_created == 'true'
        run: xcrun simctl delete "${{ steps.simulator.outputs.simulator_id }}"

